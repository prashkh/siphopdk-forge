name: Tests Runner

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux-macos-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ['3.10', '3.14']
    name: Test for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel pip-tools
          python -m piptools compile --resolver=backtracking --extra=test -o requirements.txt pyproject.toml
          python -m pip install -r requirements.txt
      - name: Build and install
        run: python -m pip install .
      - name: Install KLayout
        if: runner.os == 'Linux'
        env:
          KLAYOUT_VERSION: 0.30.12
          KLAYOUT_SHA256: 23480767fec91bc9a15e075a9bd6906ba85cd7fdda8b4040dde4ffc95c26a742
        run: |
          package="$RUNNER_TEMP/klayout.deb"
          curl --fail --location --retry 3 \
            "https://www.klayout.org/downloads/Ubuntu-24/klayout_${KLAYOUT_VERSION}-1_amd64.deb" \
            --output "$package"
          echo "$KLAYOUT_SHA256  $package" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$package"
          klayout -b -v
      - name: Verify KLayout integration
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from photonforge.extension import _find_klayout, _klayout_version

          executable = _find_klayout()
          version = _klayout_version(executable)
          numbers = tuple(int(part) for part in version.split()[-1].split(".")[:3])
          assert numbers >= (0, 29, 12), (executable, version)
          print(f"Using {version} at {executable}")
          PY
      - name: Test
        env:
          SIMCLOUD_APIKEY: ${{ secrets.SIMCLOUD_APIKEY }}
        run: |
          pytest --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - name: Confirm all KLayout tests ran
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(
              os.path.join(os.environ["RUNNER_TEMP"], "pytest-results.xml")
          ).getroot()
          skipped = []
          for case in root.iter("testcase"):
              reason = case.find("skipped")
              if reason is None:
                  continue
              message = " ".join((reason.get("message", ""), reason.text or "")).lower()
              if "klayout" in message:
                  skipped.append(f'{case.get("classname")}::{case.get("name")}')
          if skipped:
              names = "\n".join(skipped)
              raise SystemExit(f"Expected KLayout tests to run, but pytest skipped:\n{names}")
          PY
